# Shown on the "new issue" chooser. blank_issues_enabled stays true: this is
# a small project and a prescriptive form is more likely to turn someone away
# than to improve the report.
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/labtris/labtris/blob/main/SECURITY.md
    about: >-
      Do not open a public issue. Email contact@labtris.com — a public report
      is readable by everyone running Labtris, including those who have not
      upgraded yet.
  - name: Documentation
    url: https://docs.labtris.com
    about: Install guides, the API reference, and the lab walkthroughs.
  - name: Anything else
    url: mailto:contact@labtris.com
    about: Questions, and anything that does not fit an issue.
