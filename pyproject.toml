[project]
name = "labtris"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
version = "0.8.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "aiodocker==0.24.0",
  "pyroute2==0.8.1",
  "structlog==24.4.0",
  "ulid-py==1.1.0",
  "websockets==14.1",
  "pyyaml==6.0.2",
  # auth.py has imported this since #33; it was never declared. It reached the
  # development box incidentally, so everything worked there and a clean
  # install could not start at all — the first fresh install crashed on
  # `import jwt` while running migrations.
  "pyjwt==2.10.1",
  # FastAPI needs this to parse form data and file uploads. Nothing imports it
  # directly — FastAPI reaches for it at request time — so an import scan
  # cannot find it and neither could the tests, which ran where it happened to
  # be installed. It surfaced only on a clean machine, as a 502.
  "python-multipart==0.0.20",
  # For screenshot grid overlays and region crops on VNC screenshots.
  # ~3 MB wheel, universally available. Only the API imports it.
  "Pillow==11.1.0",
  # Thin wrapper over the tesseract-ocr binary. Used by /vnc/read so the
  # assistant can read a login prompt in 15 tokens instead of 1500.
  # The apt package `tesseract-ocr` and `tesseract-ocr-eng` are the real
  # deps; without them a /vnc/read call errors clearly.
  "pytesseract==0.3.13",
  # `labtris` CLI. Typer for the nested subcommand tree + parameter parsing;
  # Rich for tables and colored output; both are wheels on every supported
  # Python. Server-side code does not import either — but the CLI ships in
  # the same wheel as the API, so declaring them at the top level keeps a
  # single `pip install -e .` producing a working `labtris` binary.
  #
  # click is pinned alongside because Typer 0.15.x and Click 8.2+ have an
  # ABI mismatch on `Parameter.make_metavar()` (Click added a required
  # `ctx` positional argument in 8.2, Typer's rich-help formatter calls it
  # without one). Left unpinned pip picks Click 8.5 and `labtris --help`
  # crashes with a TypeError. Pinning Click to 8.1.x — the version Typer
  # 0.15.1 was released against — sidesteps that.
  "typer==0.15.1",
  "click==8.1.8",
  "rich==13.9.4",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "httpx==0.28.1",
  "ruff==0.8.4",
  "mypy==1.14.0",
  "types-PyYAML==6.0.12.20240917",
]

[project.scripts]
labtris-api = "labtris_api.main:run"
labtris-netd = "labtris_netd.__main__:main"
labtris-mcp = "labtris_mcp.server:main"
# `labtris` is the human-facing CLI (Phase A of the LocalStack-inspired work);
# `labtris-doctor` and `labtris-image` remain as deprecation shims that
# delegate — nothing scripted breaks, but the new tree is what we document.
labtris = "labtris_cli.__main__:app"
labtris-doctor = "labtris_api.diagnose:main"
labtris-image = "labtris_api.cli.image:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["labtris_api*", "labtris_netd*", "labtris_mcp*", "labtris_client*", "labtris_cli*"]

[tool.pytest.ini_options]
markers = [
  "anonymous: run without the automatic test sign-in",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["labtris_api", "labtris_netd"]
ignore_missing_imports = true
