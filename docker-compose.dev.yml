services:
  postgres:
    image: postgres:16
    # Without this the database does not come back after a host reboot, and
    # the whole product is down until someone notices and starts it by hand.
    restart: unless-stopped
    environment:
      POSTGRES_USER: pnl
      POSTGRES_PASSWORD: pnl
      POSTGRES_DB: pnl
    ports:
      # Overridable because a host that already runs Postgres on 5432 can't
      # bring this up at all: LABTRIS_PG_PORT=55432 make dev-db.
      - "${LABTRIS_PG_PORT:-5432}:5432"
    volumes:
      - pnl-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pnl -d pnl"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pnl-pgdata:
