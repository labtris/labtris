# Kernel limits for a host running thousands of container nodes.
#
# Every value here was reached by hitting the stock one on a real fabric, not
# by guessing. The defaults are fine for a laptop and wrong for a lab host,
# and each one fails in a way that does not name itself.
#
# inotify: 128 instances per user is the first hard wall. containerd takes
# instances per container, so a few hundred nodes in, container creation
# starts failing with ENOSPC — which surfaces as "failed to create shim task"
# and reads like a container runtime problem rather than a sysctl.
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 1048576

# ARP/ND: gc_thresh3 is the hard cap on the neighbour table. 1024 is well
# under what a few thousand links hold once they come up. Past it the kernel
# logs "neighbour: arp_cache: neighbor table overflow" and silently drops
# resolution, so a fabric half-converges and looks like a routing bug.
net.ipv4.neigh.default.gc_thresh1 = 8192
net.ipv4.neigh.default.gc_thresh2 = 32768
net.ipv4.neigh.default.gc_thresh3 = 65536
net.ipv6.neigh.default.gc_thresh1 = 8192
net.ipv6.neigh.default.gc_thresh2 = 32768
net.ipv6.neigh.default.gc_thresh3 = 65536

# One conntrack entry per routing-protocol session per direction, plus
# whatever the lab itself generates. A 931-node fat tree holds a few thousand
# BGP sessions on its own.
net.netfilter.nf_conntrack_max = 1048576

# Thousands of network namespaces, each with its own listening sockets.
net.core.somaxconn = 4096

# Not raised deliberately: net.core.rmem_max. zebra asks for a large netlink
# receive buffer and gets it via SO_RCVBUFFORCE, which bypasses this cap —
# measured at 8 MiB by default against a 4 MiB rmem_max, and 180 MB with
# `-s 90000000`. Raising it here would imply it mattered, and it does not
# unless something runs zebra without CAP_NET_ADMIN.
