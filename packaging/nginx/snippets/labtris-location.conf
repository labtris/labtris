# The proxy body, shared by the 443 and 8081 servers. See labtris.conf.
proxy_pass http://127.0.0.1:8080;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Console tunnels. Without these the WebSocket handshake is answered
# with a 400 and the terminal opens onto nothing.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# An idle VNC session sends no bytes; the 60s default closes it and the
# screen freezes with no error anywhere.
proxy_read_timeout  3600s;
proxy_send_timeout  3600s;

# Buffering a console stream adds latency to every keystroke.
proxy_buffering off;
