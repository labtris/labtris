# Labtris in front of the API on 127.0.0.1:8080.
#
# The API binds loopback only and this is what faces the network, so everything
# awkward about the app lives here: the consoles are WebSockets, a desktop
# guest sends nothing for minutes at a time, and a 2 GB image upload must not
# be buffered to disk first.
#
# THREE LISTENERS, AND WHY
#
#   443  the one to use. Self-signed by default — install-labtris.sh
#        generates the pair, and a browser will warn once. Labtris carries
#        session cookies and console streams, so plain HTTP across a network
#        was the wrong default.
#   80   redirects to 443. Typing a bare hostname should land somewhere, not
#        hang.
#   8081 kept, and not only for old bookmarks. It is the port every
#        `ssh -L` example and every QEMU hostfwd in this repo already
#        forwards, and it is plain HTTP, which means no certificate warning
#        on a tunnel to 127.0.0.1. Removing it would break working setups to
#        no benefit.
#
# A host already serving on 80 or 443 is the one case this cannot satisfy.
# nginx refuses to start with two default_servers on a port, so the installer
# disables the distribution's default site. If you run your own vhost there,
# drop this file's 80/443 blocks and keep 8081 behind your own proxy.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The proxy body is in snippets/labtris-location.conf and included by both
# serving blocks, rather than repeated. A timeout fixed for the VNC console
# should not be fixable on one port and missed on another — that is exactly
# the kind of bug that only shows up on whichever port the reporter was not
# using.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 301 would be cached by the browser and is painful to undo on a lab
    # appliance whose certificate or address changes. 302 keeps it reversible.
    return 302 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # No HTTP/2. `http2 on;` needs nginx 1.25 and noble ships 1.24, where it
    # is an unknown directive and `nginx -t` fails outright — which would
    # have taken out every native install on 24.04. The older
    # `listen ... ssl http2` form is deprecated on newer nginx, so there is
    # no spelling that is clean on both. Nothing here wants it either: the
    # payload is a small SPA plus WebSocket console streams, and multiplexing
    # does not help a tunnel that is already one long-lived connection.

    ssl_certificate     /etc/labtris/tls/labtris.crt;
    ssl_certificate_key /etc/labtris/tls/labtris.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:labtris:10m;

    client_max_body_size 8G;

    location / {
        include /etc/nginx/snippets/labtris-location.conf;
    }
}

server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    client_max_body_size 8G;

    location / {
        include /etc/nginx/snippets/labtris-location.conf;
    }
}
