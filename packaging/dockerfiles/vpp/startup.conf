unix {
  nodaemon
  cli-listen /run/vpp/cli.sock
  log /var/log/vpp/vpp.log
}
api-segment { gid vpp }
socksvr { default }
plugins {
  plugin dpdk_plugin.so { disable }
}
cpu {
  # The container sees the host's cores; which ones are free is the host's
  # business, so pin by position, not by name: main on core 4, two
  # workers on the next two. That keeps VPP off cores 0-3, where TRex
  # (and most other DPDK generators) put their own threads by default —
  # on a shared core a poll-mode worker and a DPDK core starve each other
  # and the drop looks like the DUT's. Needs a 7-core host; on fewer,
  # lower these numbers in /etc/vpp/startup.conf.
  main-core 4
  corelist-workers 5-6
}
buffers {
  page-size 4K
}
statseg { default }
